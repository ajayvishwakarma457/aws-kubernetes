
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-dep-1
  labels:
    name: node-dep-1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: second-app
      tier: backend
  template:
    metadata: 
      labels:
        app: second-app
        tier: backend
    spec: 
      containers:
        - name: second-node
          image: ajayvishwakarma457/kub-first-app:latest
